<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class = "grid">
        <div class = "img-cont" style = "grid-column-start: 1; grid-column-end: 4; grid-row-start: 1; grid-row-end: 5;">
            <img id = "cell-image" alt="Icon 1">
        </div>
        <div id = "candidates" style = "width: 20%"> </div>
    </div>

    <div class = "info">
        <div class = "inputs">
            <div>Label: <input id = "label" oninput="updateExample()" type="text" placeholder="Label"></div>
            <div>Image: <input id = "image" oninput="updateExample()" type="text" placeholder="image path"> </div>
            <div>Text Color: <input oninput="updateText()" style = "height: 2em;" id = "text-color" type = "color" value = "#000"> </div>
            <div>Flag: <input style = "height: 1.3em;" id = "flag" type = "checkbox"> </div>
        </div>
        
        <div class = "stats">

        </div>

        <div class = "example">

        </div>

        <div class = "btns">
            <div class="btn" style="background: crimson;" onclick="next()">Skip</div>
            <div class="btn" onclick="submit()">Submit</div>
        </div>
    </div>
    
   
</body>
<script>
    const cellImage = document.getElementById('cell-image');
    const candidatesDiv = document.getElementById('candidates');
    const labelInput = document.getElementById('label');
    const imageInput = document.getElementById('image');
    const flagInput = document.getElementById('flag');
    const exampleDiv = document.querySelector('.example');
    const statsDiv = document.querySelector('.stats');
    const textColorInput = document.getElementById('text-color');


    let currentCell = null;
    let cellBG = null;
    

    function selectIcon(div) {
        for (const c of candidatesDiv.children) {
            c.removeAttribute('selected');
        }
        div.setAttribute('selected', '');
        imageInput.value = div.path;
        updateExample();
    }

    function updateExample() {
        exampleDiv.innerHTML = '';
        const img = document.createElement('img');
        const inputPath = imageInput.value.trim();
        exampleDiv.toggleAttribute('no-image', inputPath === '');
        const iconURL = 'file/IconSets/'+imageInput.value;
        img.src = iconURL.split('/').map(encodeURIComponent).join('/');
        const imContainer = document.createElement('div');
        imContainer.classList.add('img-cont');
        imContainer.appendChild(img);
        const label = labelInput.value;
        const div = document.createElement('div');
        div.classList.add('label');
        div.textContent = label;
        exampleDiv.appendChild(div);
        exampleDiv.appendChild(imContainer);

        let url =('/file/cell-images/' + currentCell).split('/').map(encodeURIComponent).join('/');
        exampleDiv.style.setProperty('--cell-image', `url(${url})`);

        exampleDiv.style.setProperty('--cell-bg', cellBG);
    }

    function setIcons(icons) {
        candidatesDiv.innerHTML = '';
        for (const {path,score} of icons) {
            const img = document.createElement('img');
            const rPath = path.replace("file/IconSets/", "");
            img.title = rPath + ' - score: ' + score.toFixed(4);
            img.src = path.split('/').map(encodeURIComponent).join('/');
            const div = document.createElement('div');
            div.path = rPath;
            div.classList.add('img-cont');
            div.appendChild(img);
            div.onclick = () => {
                selectIcon(div);
            }
            candidatesDiv.appendChild(div);
        }
        selectIcon(candidatesDiv.children[0]);
    }

    function updateText() {
        exampleDiv.style.color = document.getElementById('text-color').value;
    }
  
    function setData(data, img) {
        cellImage.src = ('/file/cell-images/' + img).split('/').map(encodeURIComponent).join('/');
        cellBG = data.background;
        setIcons(data.icons);
        textColorInput.value = data.text_color || '#000000';
        updateText();
        labelInput.value = data.label || '';
        flagInput.checked = data.flagged || false;
        updateExample();
        
    }

    async function next() {
        document.body.toggleAttribute('waiting', true);
        const res = await fetch('/next');
        const data = await res.json();
        currentCell = data.cell;

        const res2 = await fetch('/search/' + currentCell + "?k=170");
        const data2 = await res2.json();
        setData(data2, currentCell);
        document.body.toggleAttribute('waiting', false);
    }

    async function searchText(text, alpha = 0.5) {
        const url = '/search_text?' + new URLSearchParams({text, k: 170, alpha});
        const res2 = await fetch(url);
        const data2 = await res2.json();
        setIcons(data2.icons);
    }

    function updateStats(data) {
        console.log('Stats:', data);
        statsDiv.innerHTML = `
            progress: ${data.progress}% <br>
            flagged: ${data.flag} <br>
            total: ${data.total} <br>
            remaining: ${data.total - data.flag - data.no_flag} <br>
        `;
    }

    async function submit() {
        document.body.toggleAttribute('waiting', true);
        const res = await fetch('/submit', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                cell: currentCell,
                label: labelInput.value,
                icon: imageInput.value,
                flagged: flagInput.checked,
                textColor: textColorInput.value
            })
        });
        const data = await res.json();
        if (data.status === 'success') {
            updateStats(data);
            next();
        } else {
            alert('Failed to submit info');
        }
        document.body.toggleAttribute('waiting', false);
    }

    next()



    // search('b61cc963739c0c9b.png');
</script>
<style>
    body[waiting] {
        cursor: wait;
        opacity: 0.5;
    }
    .example[no-image] .img-cont {
        display: none;
    }

    .example[no-image] .label {
        padding-top: 0;
        font-size: calc(0.19 * var(--size));
    }

    .example {
        width: 100%;
        aspect-ratio: 0.737;
        font-family: Arial, Helvetica, sans-serif;
        font-size: calc(0.11 * var(--size));
        text-align: center;
        padding: calc(0.04 * var(--size));
        box-sizing: border-box;
        outline: 2px solid rgb(99, 99, 255);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0;
        background-color: var(--cell-bg, #e3e3e3);
        justify-content: center;
    }
    .example:hover {
        background-image: var(--cell-image);
        background-repeat: no-repeat;
        background-position: center;
        background-size: contain;
    }
    .example:hover img {
        opacity: 0.5;
    }
    .example .img-cont {
        background: none;;
    }
    .example .label {
        padding-top: calc(0.02 * var(--size));
    }
    /* .example img {
        width: 100%;
        height: auto;
        object-fit: contain;
    } */
    body {
        --size: 30vw;
        display: flex;
        height: 100vh;
        width: 100vw;
        margin: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    }
    img {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
    }
    .img-cont {
        position: relative;
        width: 100%;
        height: 100%;
        background: #e3e3e3;
    }

    .img-cont[selected] {
        outline: 4px solid rgb(99, 99, 255);
    }
    .grid {
        display: grid;
        grid-template-columns: repeat(13, 1fr);
        grid-template-rows: repeat(14, 1fr);
        height: 100%;
        width: 100%;
        gap: 4px;
        background: rgb(94, 94, 94);
        border-right: 4px solid rgb(94, 94, 94);
    }
    #candidates {
        display: contents;
    }

    .info {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 16px;
        width: calc(var(--size) + 2 * 16px);
    }
    .btns {
        display: flex;
        gap: 8px;
    
    }
    .btn {
        padding: 8px 16px;
        background: rgb(99, 99, 255);
        color: white;
        border-radius: 4px;
        cursor: pointer;
        user-select: none;
        width: 100%;
        text-align: center;
        font-size:2em;
    }

    .inputs {
        display: flex;
        flex-direction: column;
        gap: 16px;
    }

    input {
        font-size: 1.5em;
        padding: 8px;
        width: 100%;
        box-sizing: border-box;
        outline: none;
        border: none;
        background: rgb(203, 204, 206);
        border-radius: 10px;
    }
</style>
</html>
